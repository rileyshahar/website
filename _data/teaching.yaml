- title: The Curry-Howard Isomorphism
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2026
  week: 1
  description: >
    A five-day introduction to the Curry-Howard isomorphism. We spent a day
    defining deductive systems, a day building propositional logic, two days
    building the simply-typed lambda calculus, and then just saw directly on the
    board that they were the same system. Then we spent the last day seeing what
    insights we could extract from this.

- title: Some Cool Spaces
  role: Instructor
  inst: Canada/USA Mathcamp
  coteachers:
    - Maya Saran
  year: 2026
  week: 2
  description: >
    An informal discussion of some cool spaces, and the philosophical question
    of what makes a space cool. We covered the topologist's sine curve, the long
    line, the Warsaw circle, and the rational circle.

- title:
    "The Many Faces of the Euler Characteristic: An Introduction to Algebraic
    K-theory"
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2026
  week: 3
  description: >
    An introduction to cut-and-paste algebraic K-theory as a vast generalization
    of the Euler characteristic. The primary pedagogical innovation of this
    class was defining $$K_0$$ via its universal property, without any mention
    of categories---instead seeing it as a kind of generalized Grothendieck
    group defined on "cut-and-paste contexts", which are sets with a quaternary
    relation $$X\cup_{Z}Y\cong W$$. This simple structure let us develop
    surprisingly much machinery, such as the localization theorem, and compute
    $$K_0$$ of vector spaces, simplicial complexes, surfaces, and more; without
    assuming more background than a typical Mathcamp student has.

- title: Indifference
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2026
  week: 4
  description: >
    An discussion course on the principle of indifference, as studied in
    analytic philosophy and Bayesian statistics, and especially the "restricted"
    principle of indifference formulated by Elga. Readings included Elga's
    *Defeating Dr. Evil With Self-Locating Belief* and *Self-Locating Belief and
    the Sleeping Beauty Problem*, Weatherson's *Should We Respond to Evil With
    Indifference?*, and Marcoci's *Monty Hall Saves Dr. Evil*.

- title: Truth in Fiction
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2026
  week: 5
  description: >
    A discussion-based introduction to the problem of truth in fiction,
    especially focusing on the problem of contradictory fiction and other
    questions relevant to substructural logics. Readings included Lewis's *Truth
    in Fiction*, Priest's *Sylvan's Box*, and Chiang's *Division by Zero*.

- title: A "Topological" Proof of the Infinitude of Primes
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2026
  week: 5
  description: >
    A one-day course introducing Fursternberg's proof of the infinitude of
    primes, and asking whether the extra machinery gives it any different
    mathematical value from Euclid's proof.

- title: Extra Stretchy Rubber-Sheet Geometry
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2025
  week: 1
  files: extra-stretchy-rubber-sheet-geometry
  description: >
    An informal introduction to the fundamental group, without relying on any
    underlying point-set topology.

- title: Category Theory from Scratch
  role: Instructor
  inst: Canada/USA Mathcamp
  coteachers:
    - Della Hendrickson
  year: 2025
  week: 2
  files: category-theory-from-scratch
  description: >
    An inquiry-based introduction to category theory. At the start of the class,
    students made a list of various families of mathematical constructions they
    thought could be generalized---like the cartesian product of sets and the
    direct product of groups---then searched for categorical properties
    encapsulating these families.

- title: "Oops All Algebra: An Introduction to Infinity-Categories"
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2025
  week: 3
  files: oops-all-algebra
  description: >
    An introduction to the theory of infinity-categories in the model of
    quasicategories. We discussed the need for such a theory, the difficulties
    with handling coherence, defined simplicial sets, studied the nerve of a
    category to motivate the definition of a quasicategory, and sketched the
    proof that infinity-groupoids are Kan complexes.

- title: A Tour of Paradox
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2025
  week: 4
  description: >
    A survey of various paradoxes from philosophical and mathematical history.
    Each day started with a ~10 minute lecture discussing the paradox, and then
    students discussed the paradox and talked about how various mathematical
    ideas might help us think about it differently. Paradoxes discussed included
    Zeno's paradoxes of motion, the Sorites paradox and other paradoxes of
    ambiguity, paradoxes of the material conditional, and paradoxes of
    self-reference like the liar's and Russell's paradoxes.

- title: A Cute Combinatorics Problem
  role: Instructor
  inst: Canada/USA Mathcamp
  year: 2025
  week: 5
  files: cute-combinatorics-problem
  description: >
    An introduction to the combinatorics of saturated transfer systems and
    submonoids.

